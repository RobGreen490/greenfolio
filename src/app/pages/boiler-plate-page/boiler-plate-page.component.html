<div class="page">

  <app-canvas #canvasComp class="background-canvas" [drawFn]="draw"></app-canvas>

  <div #content class="page-content">

    <!-- draw the gravity button if bouncing circles is on. -->
    @if (currentDrawable == 'bouncing-circles') {
      <div class="button-container">
        <button class="gravity-button" (click)="turnOnGravity()">
          @if (gravityOn) {
            Turn off gravity
          }
          @else {
            Turn gravity on
          }
        </button>
      </div>
    }

  </div>

</div>
